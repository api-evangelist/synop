aid: synop
name: Synop
description: >-
  Synop is a software platform for commercial electric vehicle fleet charging and
  energy management, describing itself as "the operating system for commercial EV
  fleets." Its hardware- and software-agnostic platform integrates vehicles,
  chargers, and the grid across the U.S. and Europe, spanning charge management
  (remote charger control, real-time alerts, EVSE interoperability across 100+
  charging station models), energy management (AI-based load and time-of-use
  optimization, curtailment, demand response, and vehicle-to-grid events), vehicle
  management (state-of-charge and efficiency via telematics), payment management
  (billing, driver reimbursement, and transaction reporting), utility management,
  and SynopLink edge connectivity for site-level operations. Synop cites 500+ MWh
  under management across 800+ commercial depots. Its API integrations surface
  live time-of-use rate data and export reimbursement data to accounting and
  expense systems, though the developer documentation is a password-gated ReadMe
  admin guide rather than a public developer portal.
